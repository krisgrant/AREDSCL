<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>EDS Challenge List</title>

        <link rel="icon" href="/images/Trollface.avif" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />

        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/listpacks.css" />

        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tags.css" />

        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>

        <script type="module" src="/js/main.js"></script>
    </head>

<body
    id="app"
    :class="'mode-' + ($route.meta.list || 'challenge')"
>
        <header :class="{ dark: store.dark }">

            <div class="logo">
                <img
                    :src="$route.meta.list === 'demon'
                        ? '/images/Extreme_Demon.avif'
                        : $route.meta.list === 'teeth'
                        ? '/images/Teeth.avif'
                        : '/images/Trollface.avif'"
                    :style="$route.meta.list === 'teeth'
                        ? 'width:59.5px; height:50px; object-fit:contain;'
                        : 'width:59.5px; height:50px;'"
                />

                <h2
                    :style="$route.meta.list === 'teeth'
                        ? 'line-height:4rem; font-size:1.65rem; white-space:nowrap;'
                        : 'line-height:4rem;'"
                >
                    {{
                        $route.meta.list === 'demon'
                            ? 'EDS Demonlist'
                            : $route.meta.list === 'teeth'
                            ? 'Teeth Achievements List'
                            : 'EDS Challenge List'
                    }}
                </h2>
            </div>

            <nav class="nav">

                <router-link
                    class="nav__tab"
                    :to="$route.meta.list === 'demon'
                        ? '/demons'
                        : $route.meta.list === 'teeth'
                        ? '/teeth'
                        : '/'"
                >
                    <span class="type-label-lg">List</span>
                </router-link>

                <router-link
                    class="nav__tab"
                    :to="$route.meta.list === 'demon'
                        ? '/demons/leaderboard'
                        : $route.meta.list === 'teeth'
                        ? '/teeth/leaderboard'
                        : '/leaderboard'"
                >
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>

                <router-link
                    class="nav__tab"
                    :to="$route.meta.list === 'demon'
                        ? '/demons/roulette'
                        : $route.meta.list === 'teeth'
                        ? '/teeth/roulette'
                        : '/roulette'"
                >
                    <span class="type-label-lg">Roulette</span>
                </router-link>

                <router-link
                    class="nav__tab"
                    :to="$route.meta.list === 'demon'
                        ? '/demons/list-packs'
                        : $route.meta.list === 'teeth'
                        ? '/teeth/list-packs'
                        : '/list-packs'"
                >
                    <span class="type-label-lg">Packs</span>
                </router-link>

                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/dark.svg' : '/assets/light.svg'"
                            alt=""
                        />
                    </button>

                    <a class="nav__icon" href="https://discord.gg/MS4sVhVHnB">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>

                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/GkcNGb2oo3xT7QE99"
                        target="_blank"
                    >
                        Submit Record
                    </a>
                </div>
            </nav>
        </header>

        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
